name: bot

on:
  schedule:
    - cron: "0 */6 * * *"
    - cron: "15 */6 * * *"
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip >/dev/null
          npm i -g openclaw@latest 2>&1 | tail -5
          command -v openclaw || { echo "openclaw missing"; exit 1; }
          python3 -m pip install -q --break-system-packages yt-dlp 2>&1 | tail -3 || true
          python3 -m pip install -q --break-system-packages faster-whisper 2>&1 | tail -3 || echo "whisper skipped"
          command -v yt-dlp || python3 -m pip install -q --user yt-dlp || true

      - name: free model router
        run: |
          git clone --depth 1 https://github.com/tashfeenahmed/freellmapi /tmp/freellmapi
          cd /tmp/freellmapi/server
          npm install --no-audit --no-fund >/dev/null 2>&1
          npm run build >/dev/null 2>&1

      - name: run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bash run-bot.sh
