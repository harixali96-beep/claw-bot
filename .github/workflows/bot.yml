name: bot

on:
  schedule:
    # two crons so the next window starts right after the previous one ends
    - cron: "0 */6 * * *"
    - cron: "15 */6 * * *"
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip >/dev/null
          npm i -g openclaw@latest >/dev/null 2>&1
          pip install -q yt-dlp faster-whisper

      - name: free model router
        run: |
          git clone --depth 1 https://github.com/tashfeenahmed/freellmapi /tmp/freellmapi
          cd /tmp/freellmapi/server
          npm install --no-audit --no-fund >/dev/null 2>&1
          npm run build >/dev/null 2>&1

      - name: run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: bash run-bot.sh
